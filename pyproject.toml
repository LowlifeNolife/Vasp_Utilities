[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build_meta"

[project]
name = "vasp-utilities"
version = "0.1.0"
description = "Utilities/functions for use in VASP calculations like convergence and optimisation"
authors = [
    {name = "Shriyans Thakur", email = "shriyansthakur@gmail.com"}
]
maintainers = [
    {name = "Shriyans Thakur" ,email = "shriyansthakur@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ase>=3.29.0",
    "matplotlib>=3.11.1",
    "mp-api>=0.46.5",
    "numpy>=2.5.1",
    "pymatgen>=2026.5.4",
    "scipy>=1.18.0",
    "seekpath>=2.2.1",
    "spglib>=2.7.0",
]

license = {file = "LICENSE"}

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12,
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research"

]

[tool.hatch.build.targets.wheel]
packages = ["src/vasputils"]
